<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>F1 Driver - เรียกรถ</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script charset="utf-8" src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" />
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@300;400;500;700&display=swap');
    body { font-family: 'Kanit', sans-serif; background-color: #f3f4f6; }
    .map-container { position: fixed; inset: 0; width: 100vw; height: 100vh; z-index: 0; background: #e5e7eb; }
    .ui-panel { position: fixed; bottom: 0; left: 0; right: 0; background: white; border-top-left-radius: 24px; border-top-right-radius: 24px; box-shadow: 0 -10px 25px rgba(0,0,0,0.15); z-index: 10; display: flex; flex-direction: column; padding: 20px; max-height: 55vh; overflow-y: auto;}
    .full-page { position: fixed; inset: 0; z-index: 30; background: white; flex-direction: column; }
    .pac-container { z-index: 10000 !important; font-family: 'Kanit'; }
  </style>
</head>
<body class="h-screen w-screen m-0 overflow-hidden">

  <div id="map" class="map-container hidden"></div>

  <div id="navBar" class="hidden fixed top-0 w-full h-16 bg-[#2B3A6F] flex items-center justify-between px-4 z-20 text-white shadow-md">
    <button onclick="goBack()" class="p-2 text-2xl"><i class="fas fa-chevron-left"></i></button>
    <h1 id="navTitle" class="text-lg font-bold">F1 Driver</h1>
    <button onclick="goHome()" class="p-2 text-xl"><i class="fas fa-home"></i></button>
  </div>

  <div id="page1" class="full-page flex">
    <div class="bg-[#2B3A6F] text-white p-6 text-center shadow-lg"><h1 class="text-2xl font-black">F1 Driver</h1></div>
    <div class="p-6 space-y-6 flex-1 flex flex-col justify-center">
      <div class="text-center">
        <img id="userPic" class="w-24 h-24 rounded-full mx-auto mb-4 border-4 border-[#2B3A6F] object-cover" src="https://via.placeholder.com/150">
        <h2 class="text-xl font-bold" id="userName">กำลังโหลด...</h2>
      </div>
      <div class="bg-blue-50 p-6 rounded-2xl text-center border border-blue-100">
        <h3 class="text-gray-600 mb-2">สถานะผู้ขับขี่</h3>
        <div id="driverStatus" class="text-2xl font-black text-gray-400">กำลังโหลด...</div>
      </div>
      <button id="btnStart" onclick="showPage(2)" class="w-full bg-[#2B3A6F] text-white py-4 rounded-xl font-bold text-lg opacity-50 cursor-not-allowed transition" disabled>เริ่มต้นเรียกรถ</button>
    </div>
  </div>

  <div id="page2" class="hidden">
    <div class="ui-panel h-[350px]">
      <div class="flex justify-between items-center mb-3">
        <p class="text-sm font-bold text-gray-700">📍 เลือกจุดรับ</p>
        <button onclick="useCurrentLocation()" class="text-xs bg-blue-100 text-blue-700 px-3 py-1 rounded-full"><i class="fas fa-crosshairs"></i> ตำแหน่งปัจจุบัน</button>
      </div>
      <input type="text" id="pickupSearch" class="w-full p-4 bg-gray-100 rounded-xl mb-4 outline-none font-medium" placeholder="ค้นหาสถานที่...">
      <p class="text-xs text-gray-500 mb-2 truncate" id="pickupAddressText">กำลังดึงที่อยู่...</p>
      <button onclick="confirmPickup()" class="w-full bg-[#2B3A6F] text-white py-4 rounded-xl font-bold mt-auto">ถัดไป</button>
    </div>
  </div>

  <div id="page3" class="hidden">
    <div class="ui-panel h-[350px]">
      <div class="flex justify-between items-center mb-3">
        <p class="text-sm font-bold text-gray-700">🏁 เลือกจุดส่ง</p>
      </div>
      <input type="text" id="dropoffSearch" class="w-full p-4 bg-gray-100 rounded-xl mb-4 outline-none font-medium" placeholder="ค้นหาสถานที่...">
      <p class="text-xs text-gray-500 mb-2 truncate" id="dropoffAddressText">กำลังดึงที่อยู่...</p>
      <button onclick="confirmDropoff()" class="w-full bg-[#2B3A6F] text-white py-4 rounded-xl font-bold mt-auto">ถัดไป</button>
    </div>
  </div>

  <div id="page4" class="hidden">
    <div class="ui-panel h-[450px]">
      <h2 class="font-bold text-center border-b pb-3 mb-3">สรุปการเดินทาง</h2>
      <div class="bg-gray-50 p-3 rounded-xl mb-3 border text-sm">
        <p class="text-gray-500 text-xs">จุดรับ: <span id="sumPick" class="text-gray-800 font-bold block truncate">...</span></p>
        <p class="text-gray-500 text-xs mt-2">จุดส่ง: <span id="sumDrop" class="text-gray-800 font-bold block truncate">...</span></p>
      </div>
      <div class="flex justify-between bg-blue-50 p-3 rounded-xl mb-3 text-sm">
        <div>
          <p class="text-gray-500 text-xs">ระยะทาง</p>
          <p class="font-bold text-blue-700"><span id="sumDist">0</span> กม.</p>
        </div>
        <div>
          <p class="text-gray-500 text-xs">เวลารอ</p>
          <p class="font-bold text-blue-700"><span id="sumWait">0</span> นาที</p>
        </div>
        <div class="text-right">
          <p class="text-gray-500 text-xs">ราคา</p>
          <p class="font-black text-xl text-green-600"><span id="sumPrice">0</span> ฿</p>
        </div>
      </div>
      <input type="tel" id="userPhone" placeholder="เบอร์โทรติดต่อ (10 หลัก)" class="w-full p-3 border rounded-xl mb-4 text-center font-bold" maxlength="10">
      <button onclick="submitBooking()" class="w-full bg-green-600 text-white py-4 rounded-xl font-bold text-lg mt-auto">ยืนยันเรียกรถ</button>
    </div>
  </div>

  <div id="pageTracking" class="hidden">
    <div class="ui-panel h-[350px]">
      <div class="flex justify-between items-center border-b pb-3 mb-3">
        <h2 class="font-black text-indigo-700 text-lg" id="trackStatus">รอผู้ขับขี่ตอบรับ...</h2>
        <span class="bg-gray-100 px-3 py-1 rounded-full font-bold text-gray-700" id="trackPrice">฿0</span>
      </div>
      
      <div class="mb-4">
        <p class="text-xs text-gray-400">จาก: <span class="font-bold text-gray-700" id="trackPick">...</span></p>
        <p class="text-xs text-gray-400">ถึง: <span class="font-bold text-gray-700" id="trackDrop">...</span></p>
      </div>

      <button onclick="openNavMap()" class="w-full bg-blue-50 text-blue-600 py-3 rounded-xl font-bold mb-2 flex items-center justify-center gap-2 border border-blue-200">
        <i class="fas fa-location-arrow"></i> แผนที่นำทาง (Google Maps)
      </button>
      <button id="btnCancel" onclick="cancelBooking()" class="w-full bg-red-50 text-red-600 py-3 rounded-xl font-bold border border-red-200 mt-auto">ยกเลิกเรียกรถ</button>
    </div>
  </div>

  <script>
    // --- ตั้งค่าระบบ ---
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwwdopAPESHRrHEYTSa-CzFMbh0JX9WHUa37PMEJmxDkah7ui67cVtOn68cnM-2DtmR/exec"; // จะอธิบายด้านล่าง
    const MY_LIFF_ID = "Uc293fb578c6db9a9106fc0fd0f40c076";
    
    firebase.initializeApp({
      // ใส่ Firebase Config ตรงนี้
      firebase.initializeApp({
      apiKey: "AIzaSyBNtaYaX1OW-86_9EGiVN9EpgPzWOX_twQ",
      authDomain: "myride-chiangrai.firebaseapp.com",
      databaseURL: "https://myride-chiangrai-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "myride-chiangrai",
      storageBucket: "myride-chiangrai.firebasestorage.app",
      messagingSenderId: "1048189690454",
      appId: "1:1048189690454:web:7c2c4c9bbf12b9c77ed1f7"
    });
    const db = firebase.database();
    });
    const db = firebase.database();

    // ตัวแปรส่วนกลาง
    let map, directionsService, directionsRenderer, geocoder, placesService;
    let markerPick, markerDrop, markerDriver;
    let lineUserId = "", lineName = "";
    let driverData = { lat: 19.910479, lng: 99.840576, status: "ออฟไลน์" };
    let bookData = { pLat:0, pLng:0, pName:"", dLat:0, dLng:0, dName:"", price:0, status:"" };
    let currentStep = 1;

    // 1. เริ่มต้น LIFF และดึงข้อมูล
    liff.init({ liffId: MY_LIFF_ID }).then(() => {
      if(liff.isLoggedIn()){
        liff.getProfile().then(p => {
          lineUserId = p.userId; lineName = p.displayName;
          document.getElementById('userName').innerText = lineName;
          document.getElementById('userPic').src = p.pictureUrl;
          initApp();
        });
      } else { liff.login(); }
    });

    function initApp() {
      // ฟังสถานะคนขับ
      db.ref('driver').on('value', snap => {
        const d = snap.val();
        if(d) {
          driverData = d;
          let ds = document.getElementById('driverStatus');
          let btn = document.getElementById('btnStart');
          if(d.status === "ออนไลน์") {
            ds.innerText = "🟢 ออนไลน์"; ds.className = "text-2xl font-black text-green-600";
            btn.disabled = false; btn.classList.remove('opacity-50', 'cursor-not-allowed');
          } else {
            ds.innerText = "🔴 ออฟไลน์"; ds.className = "text-2xl font-black text-red-500";
            btn.disabled = true; btn.classList.add('opacity-50', 'cursor-not-allowed');
          }
          if(currentStep >= 5) updateRealtimeMap();
        }
      });

      // จำสถานะลูกค้า
      db.ref('bookings/' + lineUserId).on('value', snap => {
        const b = snap.val();
        if(b) { bookData = b; handleTracking(); } 
        else if (currentStep === 5) window.location.reload();
      });
    }

    // 2. แผนที่พื้นฐาน
    function initMap() {
      if(map) return;
      map = new google.maps.Map(document.getElementById('map'), { 
        zoom: 16, center: {lat: driverData.lat, lng: driverData.lng}, mapTypeId: 'hybrid', disableDefaultUI: true, gestureHandling: 'greedy' 
      });
      directionsService = new google.maps.DirectionsService();
      directionsRenderer = new google.maps.DirectionsRenderer({ map: map, suppressMarkers: true, polylineOptions: {strokeColor:'#2B3A6F', strokeWeight:5} });
      geocoder = new google.maps.Geocoder();
      placesService = new google.maps.places.PlacesService(map);
      
      markerPick = new google.maps.Marker({map: map, icon: "https://img.icons8.com/color/48/marker.png", zIndex: 2});
      markerDrop = new google.maps.Marker({map: map, icon: "https://img.icons8.com/color/48/flag.png", zIndex: 2});
      markerDriver = new google.maps.Marker({map: map, icon: "https://img.icons8.com/color/48/car-top-view.png", zIndex: 3});

      map.addListener('dragend', () => updateAddressBox());
    }

    // จัดการ UI
    function showPage(page) {
      currentStep = page;
      [1,2,3,4,'Tracking'].forEach(p => document.getElementById('page'+p).classList.add('hidden'));
      document.getElementById('page' + page).classList.remove('hidden');
      
      if(page > 1) {
        document.getElementById('navBar').classList.remove('hidden');
        document.getElementById('map').classList.remove('hidden');
        initMap();
        google.maps.event.trigger(map, 'resize');
      }

      if(page === 2) {
        document.getElementById('navTitle').innerText = "เลือกจุดรับ";
        markerDrop.setVisible(false); markerPick.setVisible(true);
        map.setCenter({lat: driverData.lat, lng: driverData.lng});
        updateAddressBox();
        setupSearch('pickupSearch', markerPick);
      } 
      else if(page === 3) {
        document.getElementById('navTitle').innerText = "เลือกจุดส่ง";
        markerPick.setVisible(true); markerDrop.setVisible(true);
        markerDrop.setPosition(markerPick.getPosition());
        map.setCenter(markerPick.getPosition());
        updateAddressBox();
        setupSearch('dropoffSearch', markerDrop);
      }
      else if(page === 4) {
        document.getElementById('navTitle').innerText = "ยืนยันเรียกรถ";
        calculatePrice();
      }
    }
    function goBack() { if(currentStep > 1 && currentStep < 5) showPage(currentStep - 1); }
    function goHome() { window.location.reload(); }

    function updateAddressBox() {
      let isPick = (currentStep === 2);
      let pos = map.getCenter();
      let m = isPick ? markerPick : markerDrop;
      m.setPosition(pos);
      geocoder.geocode({location: pos}, (res, status) => {
        if(status === 'OK' && res[0]) {
          let addr = res[0].formatted_address.replace(', ประเทศไทย','');
          if(isPick) { bookData.pName = addr; document.getElementById('pickupAddressText').innerText = addr; }
          else { bookData.dName = addr; document.getElementById('dropoffAddressText').innerText = addr; }
        }
      });
    }

    function setupSearch(inputId, marker) {
      const input = document.getElementById(inputId);
      const auto = new google.maps.places.Autocomplete(input, {componentRestrictions: {country: 'th'}});
      auto.addListener('place_changed', () => {
        const place = auto.getPlace();
        if(place.geometry) {
          map.setCenter(place.geometry.location); marker.setPosition(place.geometry.location);
          if(currentStep===2) bookData.pName = place.name; else bookData.dName = place.name;
        }
      });
    }
    function useCurrentLocation() {
      navigator.geolocation.getCurrentPosition(p => {
        let pos = {lat: p.coords.latitude, lng: p.coords.longitude};
        map.setCenter(pos); markerPick.setPosition(pos); updateAddressBox();
      });
    }
    function confirmPickup() { bookData.pLat = markerPick.getPosition().lat(); bookData.pLng = markerPick.getPosition().lng(); showPage(3); }
    function confirmDropoff() { bookData.dLat = markerDrop.getPosition().lat(); bookData.dLng = markerDrop.getPosition().lng(); showPage(4); }

    // 3. คำนวณราคา (ตามโจทย์: วิ่งจริง x 14) + (ระยะคนขับมารับ x 4)
    function calculatePrice() {
      document.getElementById('sumPick').innerText = bookData.pName;
      document.getElementById('sumDrop').innerText = bookData.dName;
      
      let origin = new google.maps.LatLng(bookData.pLat, bookData.pLng);
      let dest = new google.maps.LatLng(bookData.dLat, bookData.dLng);
      let driverPos = new google.maps.LatLng(driverData.lat, driverData.lng);

      // หาระยะ: จุดรับ -> จุดส่ง
      directionsService.route({origin: origin, destination: dest, travelMode: 'DRIVING'}, (resRide, stat1) => {
        if(stat1 === 'OK') {
          directionsRenderer.setDirections(resRide);
          map.panBy(0, -150);
          let distRideKm = resRide.routes[0].legs[0].distance.value / 1000;
          
          // หาระยะ: คนขับ -> จุดรับ
          directionsService.route({origin: driverPos, destination: origin, travelMode: 'DRIVING'}, (resDrive, stat2) => {
            if(stat2 === 'OK') {
              let distDriverKm = resDrive.routes[0].legs[0].distance.value / 1000;
              let waitMins = Math.ceil(resDrive.routes[0].legs[0].duration.value / 60);
              
              // คำนวณสูตร
              bookData.price = Math.ceil((distRideKm * 14) + (distDriverKm * 4));
              
              document.getElementById('sumDist').innerText = distRideKm.toFixed(1);
              document.getElementById('sumWait').innerText = waitMins;
              document.getElementById('sumPrice').innerText = bookData.price;
            }
          });
        }
      });
    }

    // 4. บันทึกข้อมูล & แจ้งเตือน
    function submitBooking() {
      let tel = document.getElementById('userPhone').value;
      if(tel.length < 9) return alert('กรอกเบอร์โทรให้ถูกต้อง');
      bookData.userId = lineUserId; bookData.name = lineName; bookData.phone = tel;
      bookData.status = "รอผู้ขับขี่ตอบรับ"; bookData.timestamp = firebase.database.ServerValue.TIMESTAMP;
      
      db.ref('bookings/' + lineUserId).set(bookData).then(() => {
        // แจ้งเตือนไลน์
        fetch(`${APPS_SCRIPT_URL}?action=notify&type=new_ride&name=${lineName}&pick=${bookData.pName}`, {mode: 'no-cors'});
        showPage('Tracking');
      });
    }

    // 5. ติดตามสถานะ
    function handleTracking() {
      if(currentStep !== 'Tracking') showPage('Tracking');
      let statusEl = document.getElementById('trackStatus');
      let btnCancel = document.getElementById('btnCancel');
      
      statusEl.innerText = bookData.status;
      document.getElementById('trackPrice').innerText = "฿" + bookData.price;
      document.getElementById('trackPick').innerText = bookData.pName;
      document.getElementById('trackDrop').innerText = bookData.dName;

      // จัดการปุ่มยกเลิก
      if(bookData.status === "รอผู้ขับขี่ตอบรับ" || bookData.status.includes("กำลังเดินทาง")) {
        btnCancel.classList.remove('hidden');
      } else {
        btnCancel.classList.add('hidden');
      }

      if(bookData.status.includes("ถึงที่หมาย")) {
        alert("ถึงที่หมายอย่างปลอดภัย ขอบคุณที่ใช้บริการ F1 Driver ครับ!");
        db.ref('bookings/' + lineUserId).remove();
        window.location.reload();
      }

      updateRealtimeMap();
    }

    function updateRealtimeMap() {
      if(!directionsService || !bookData.status) return;
      markerDriver.setPosition({lat: driverData.lat, lng: driverData.lng});
      markerDriver.setVisible(true);

      let origin, dest;
      // แบ่ง Phase แผนที่
      if(bookData.status === "รอผู้ขับขี่ตอบรับ" || bookData.status.includes("รับงาน") || bookData.status.includes("มาถึงจุดรับ")) {
        origin = markerDriver.getPosition();
        dest = {lat: bookData.pLat, lng: bookData.pLng};
      } else {
        // ออกเดินทาง
        origin = markerDriver.getPosition();
        dest = {lat: bookData.dLat, lng: bookData.dLng};
      }

      directionsService.route({origin: origin, destination: dest, travelMode: 'DRIVING'}, (res, stat) => {
        if(stat === 'OK') {
          directionsRenderer.setDirections(res);
          setTimeout(()=>{ map.fitBounds(res.routes[0].bounds); map.panBy(0,-100); }, 200);
        }
      });
    }

    function cancelBooking() {
      if(confirm('ยืนยันยกเลิกเรียกรถ?')) {
        db.ref('bookings/' + lineUserId).remove();
        fetch(`${APPS_SCRIPT_URL}?action=notify&type=cancel&name=${lineName}`, {mode:'no-cors'});
        alert('ยกเลิกแล้ว'); window.location.reload();
      }
    }

    function openNavMap() {
      let lat = bookData.status.includes("ออกเดินทาง") ? bookData.dLat : bookData.pLat;
      let lng = bookData.status.includes("ออกเดินทาง") ? bookData.dLng : bookData.pLng;
      window.open(`https://www.google.com/maps/dir/?api=1&origin=${driverData.lat},${driverData.lng}&destination=${lat},${lng}&travelmode=driving`, '_blank');
    }
  </script>
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSy...&libraries=places&callback=initMap" async defer></script>
</body>
</html>
